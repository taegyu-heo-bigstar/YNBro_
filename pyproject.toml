[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ynb"
version = "0.0.1"
description = "2026 오픈소스 개발자대회 - 동일 LAN RTSP 장치 자동 발견 및 연결 확인 (UDP ADVERTISE/ACK/DETAIL/ACK + RTSP OPTIONS)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "YNBro contributors" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
